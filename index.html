<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geoclock — world day/night clock</title>
    <meta
      name="description"
      content="A Geochron-style world clock for the browser: a scrolling world map with a live day/night terminator, time-zone arrows and sunrise/sunset readouts."
    />
    <meta name="theme-color" content="#0a1116" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%230b2230'/><path d='M3 16a13 13 0 0 0 26 0z' fill='%23060c22'/><circle cx='16' cy='16' r='13' fill='none' stroke='%23ffb257' stroke-width='2'/></svg>" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="machine">
        <div class="band">
          <svg id="band-svg" class="band-svg"></svg>
          <button id="fs" class="fs" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
            </svg>
          </button>
        </div>

        <div class="world">
          <div id="map" class="map"></div>
          <svg id="overlay" class="overlay"></svg>
          <div class="dial-wrap">
            <svg id="dial" class="dial"></svg>
          </div>
          <div id="hover" class="hover"></div>
          <div id="err" class="err" hidden></div>
        </div>

        <div class="readout">
          <div class="date-block">
            <span id="date-weekday" class="date-weekday"></span>
            <span id="date-month" class="date-month"></span>
            <span id="date-day" class="date-day"></span>
            <span id="date-year" class="date-year"></span>
          </div>
          <div class="clock-block">
            <div class="clock-label">Local</div>
            <div id="local-time" class="clock-time">--:--:--</div>
            <div id="local-zone" class="clock-zone"></div>
          </div>
          <div class="clock-block">
            <div class="clock-label">UTC</div>
            <div id="utc-time" class="clock-time">--:--</div>
          </div>
        </div>
      </div>

      <p class="credit">
        World map: <a href="https://www.naturalearthdata.com/" rel="noopener">Natural Earth</a> (public domain).
        Time-zone lookup: tz-lookup (CC0). Solar position: SunCalc (BSD-2). Built with
        <a href="https://maplibre.org/" rel="noopener">MapLibre GL JS</a>.
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
