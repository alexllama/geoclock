<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geoclock — world day/night clock</title>
    <meta
      name="description"
      content="A Geochron-style world clock for the browser: a scrolling world map with a live day/night terminator, time-zone arrows and sunrise/sunset readouts."
    />
    <meta name="theme-color" content="#0a1116" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%230b2230'/><path d='M3 16a13 13 0 0 0 26 0z' fill='%23060c22'/><circle cx='16' cy='16' r='13' fill='none' stroke='%23ffb257' stroke-width='2'/></svg>" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="machine">
        <div class="stage">
          <div class="band">
            <svg id="band-svg" class="band-svg"></svg>
          </div>
          <div id="world" class="world">
            <svg id="map-svg" class="map-svg" viewBox="0 0 2048 1024" preserveAspectRatio="none"></svg>
            <svg id="overlay" class="overlay" preserveAspectRatio="none"></svg>

            <div class="readout">
              <div id="date" class="date"></div>
              <div class="clock-block">
                <div class="clock-label">Local</div>
                <div id="local-time" class="clock-time">--:--:--</div>
                <div id="local-zone" class="clock-zone"></div>
              </div>
              <div class="clock-block">
                <div class="clock-label">UTC</div>
                <div id="utc-time" class="clock-time">--:--</div>
                <div class="clock-zone"></div>
              </div>

              <div class="map-controls">
                <div class="info">
                  <button id="info-btn" class="icon-btn" type="button" aria-label="About this map" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
                      <circle cx="12" cy="7.7" r="1.25" fill="currentColor" />
                      <rect x="11" y="10.4" width="2" height="6.6" rx="1" fill="currentColor" />
                    </svg>
                  </button>
                  <div id="info-pop" class="info-pop" hidden>
                    <h2>About this map</h2>
                    <p>
                      Imagery: <a href="https://earthdata.nasa.gov/gibs" rel="noopener">NASA GIBS</a> — Blue Marble (day) and
                      Black Marble / VIIRS city lights (night).
                    </p>
                    <p>
                      Country outlines: <a href="https://www.naturalearthdata.com/" rel="noopener">Natural Earth</a> (public domain).
                    </p>
                    <p>Time-zone lookup: tz-lookup (CC0). Solar position: SunCalc (BSD-2).</p>
                  </div>
                </div>

                <button id="tooltip-toggle" class="icon-btn" type="button" aria-label="Toggle location tooltip" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3v12l3.1-3.1h5.4L6 3Z" fill="currentColor" />
                  </svg>
                </button>

                <button id="basemap-toggle" class="icon-btn" type="button" aria-label="Switch base map" aria-pressed="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" fill="currentColor" />
                    <path d="M3 12.2 12 16.7l9-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                    <path d="M3 16.4 12 20.9l9-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
            </div>

            <div id="hover" class="hover"></div>
            <div id="err" class="err" hidden></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
